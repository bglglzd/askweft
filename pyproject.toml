[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "askweft"
version = "0.1.0"
description = "Explainable field requests over supplied invoice and bank-record alternatives."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "bglglzd"}]
dependencies = []

[project.scripts]
askweft = "askweft.cli:main"

[tool.setuptools]
packages = ["askweft"]
include-package-data = false

[tool.setuptools.package-data]
askweft = ["assets/*", "examples/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
